apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseboard
  labels:
    app: pulseboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulseboard
  template:
    metadata:
      labels:
        app: pulseboard
    spec:
      containers:
        - name: pulseboard
          image: DOCKERHUB_USERNAME/pulseboard:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
